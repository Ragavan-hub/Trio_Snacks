{% extends "base.html" %}

{% block title %}Staff Login — {{ global_shop_name }}{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <h2>Staff Portal Login</h2>
            <p>Sign in to access POS Billing, Orders &amp; Store Management</p>
        </div>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-large btn-block">Sign In to POS</button>
        </form>

        <div class="login-info">
            <p><strong>Quick Demo Fill (Click to populate):</strong></p>
            <div class="login-credential-badges">
                <button type="button" class="credential-chip" onclick="fillCredentials('admin', 'admin123')">
                    👑 Admin: admin / admin123
                </button>
                <button type="button" class="credential-chip" onclick="fillCredentials('cashier', 'cashier123')">
                    🧾 Cashier: cashier / cashier123
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function fillCredentials(user, pass) {
    document.getElementById('username').value = user;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
